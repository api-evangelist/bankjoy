aid: bankjoy
name: Bankjoy
description: >-
  Bankjoy is an end-to-end digital banking platform purpose-built for community
  banks and credit unions. Founded in 2014 and based in the Detroit metro area
  (Royal Oak, Michigan), the Y Combinator- and Bessemer-backed fintech delivers
  consumer and business online and mobile banking, online account opening,
  online loan origination, digital statements, and fraud tooling (FraudSense) to
  85+ financial institutions serving more than one million members. Bankjoy's
  API-based technology integrates with banking cores including Corelation
  KeyStone (as its first Certified Partner) and Fiserv, plus 150+ partner
  integrations. It is a business-to-business SaaS provider and does not publish
  a public developer API or OpenAPI surface.
